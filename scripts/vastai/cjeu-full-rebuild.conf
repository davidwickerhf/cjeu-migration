[program:cjeu_full_rebuild]
environment=PROC_NAME="%(program_name)s",SKIP_UPLOAD="1"
command=/workspace/cjeu-migration/scripts/vastai/full_rebuild_supervisor.sh
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/cjeu-full-rebuild.log
redirect_stderr=true
stdout_logfile_maxbytes=0
